[package]
name = "wadatsumi"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
bitflags = "2.11.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
anyhow = "1.0.102"
datatest-stable = "0.3.3"
regex = "1.12.3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[test]]
name = "instr-test-v5"
harness = false
