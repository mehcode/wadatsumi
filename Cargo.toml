[workspace]
members = [".", "crates/cpu-2a03"]

[package]
name = "wadatsumi"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
enum_dispatch = "0.3.13"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wadatsumi-cpu-2a03 = { path = "crates/cpu-2a03" }

[dev-dependencies]
anyhow = "1.0.102"
datatest-stable = "0.3.3"
divan = "0.1"
regex = "1.12.3"

[lints.rust]
unused = { level = "allow", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
inline_always = { level = "allow" }

[[bench]]
name = "cpu"
harness = false

[[test]]
name = "instr-test-v5"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "debuginfo"
